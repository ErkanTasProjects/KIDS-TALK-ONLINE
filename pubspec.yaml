name: kids_talk_online
description: "Kids Talk Online - Gamified English Learning App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_tts: ^4.2.5
  audioplayers: ^6.1.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/sounds/speech/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/user_mascot_transparent.png"
  min_sdk_android: 21
