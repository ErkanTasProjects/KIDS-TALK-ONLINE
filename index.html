<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA / Mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kids Talk" />
    <meta name="theme-color" content="#58cc02" />
    <meta name="description" content="Kids Talk Online – Fun English learning for children ages 4–10" />

    <!-- Favicon placeholder -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Google Fonts preload -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <title>Kids Talk Online – Fun English for Kids</title>

    <!-- Prevent FOUC dark mode flicker -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('kids_talk_theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#0f172a';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="font-bubble text-slate-800 antialiased select-none overflow-x-hidden overscroll-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
